    function addPointsToLayer(points, layer, typeLabel, accLabel, accUnit) {
        for (var i = 0; i < points.length; i++) {
            var p = points[i];
            L.circleMarker([p[0], p[1]], {
                radius: 0.5,
                fillColor: p[2],
                color: p[2],
                weight: 1,
                opacity: 1,
                fillOpacity: 0.8
            }).bindPopup(typeLabel + ": " + p[3] + "<br>" + accLabel + ": " + p[4] + accUnit).addTo(layer);
        }
    }

    addPointsToLayer(pointsGpsSol, layerGpsSol, "Typ (pos_type)", "Přesnost (hAcc)", "m");
    addPointsToLayer(pointsGpsAcc, layerGpsAcc, "Typ (pos_type)", "Přesnost (hAcc)", "m");
    addPointsToLayer(pointsHdgSol, layerHdgSol, "Typ (pos_type)", "Přesnost (hdg_std)", "°");
    addPointsToLayer(pointsHdgAcc, layerHdgAcc, "Typ (pos_type)", "Přesnost (hdg_std)", "°");

            opacity: 1.0
        }).bindPopup("Zdroj (fusionSol): " + v[3] + "<br>Heading: " + v[4] + "°").addTo(layerFusionVec);
